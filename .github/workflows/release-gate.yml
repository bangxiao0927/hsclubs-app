name: Release gate

# Never on pull_request: a school's own outage or a flaky Google run must not turn an unrelated
# PR red. This is the gate a release is held to, run on a schedule and on demand.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  contract:
    name: v1 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-contracts.mjs

  release-check:
    name: core app and real schools ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # An unset repository variable arrives as an empty string; the script deliberately falls
      # back to production in that case.
      - run: node scripts/release-check.mjs
        env:
          HSCLUBS_GUIDE_ORIGIN: ${{ vars.HSCLUBS_GUIDE_ORIGIN }}

  google-e2e:
    name: google sign-in end to end
    if: ${{ vars.HSCLUBS_MOBILE_AUTH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A real Google test account driving the whole sign-in is the last gate before release. It
      # lives here, on the schedule and on demand, rather than on PRs, because Google automation is
      # subject to MFA, captcha and risk checks and must never block ordinary work.
      #
      # This job remains skipped while the native feature flag is off. Enabling the repository
      # variable makes missing credentials or the placeholder driver fail closed.
      - name: run staging Google sign-in E2E
        env:
          GOOGLE_TEST_ACCOUNT: ${{ secrets.GOOGLE_TEST_ACCOUNT }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$GOOGLE_TEST_ACCOUNT" ] || [ -z "$GOOGLE_TEST_PASSWORD" ] || [ -z "$STAGING_BASE_URL" ]; then
            echo "Google sign-in E2E is not wired: set GOOGLE_TEST_ACCOUNT, GOOGLE_TEST_PASSWORD and STAGING_BASE_URL."
            echo "The release gate is intentionally failing so a release is not shipped without this check (hsclubs-app#4)."
            exit 1
          fi
          echo "Credentials present; run the staging Google sign-in driver here."
          # TODO: invoke the real end-to-end sign-in driver against $STAGING_BASE_URL.
          echo "Google sign-in E2E driver is not implemented yet."
          exit 1

  mobile-auth-readiness:
    name: mobile auth prerequisites
    if: ${{ vars.HSCLUBS_MOBILE_AUTH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/release-check.mjs
        env:
          HSCLUBS_GUIDE_ORIGIN: ${{ vars.HSCLUBS_GUIDE_ORIGIN }}
          HSCLUBS_REQUIRE_MOBILE_AUTH: 'true'
