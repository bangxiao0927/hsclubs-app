name: HSclubs
options:
  bundleIdPrefix: net.hsclubs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

configs:
  Development: debug
  Staging: release
  Production: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HSclubs:
    type: application
    platform: iOS
    sources:
      - path: HSclubsApp
    entitlements:
      path: HSclubsApp/App/HSclubs.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:hsclubs.net
          - webcredentials:hsclubs.net
    info:
      path: HSclubsApp/App/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        CFBundleDisplayName: HSclubs
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    configFiles:
      Development: Configurations/Development.xcconfig
      Staging: Configurations/Staging.xcconfig
      Production: Configurations/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hsclubs.app
        PRODUCT_NAME: HSclubs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1,2"

  HSclubsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HSclubsAppTests
    dependencies:
      - target: HSclubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hsclubs.app.tests
        GENERATE_INFOPLIST_FILE: YES

  HSclubsAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HSclubsAppUITests
    dependencies:
      - target: HSclubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hsclubs.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HSclubs

schemes:
  HSclubs:
    shared: true
    build:
      targets:
        HSclubs: all
        HSclubsAppTests: [test]
        HSclubsAppUITests: [test]
    run:
      config: Development
    test:
      config: Development
      gatherCoverageData: true
      targets:
        - HSclubsAppTests
        - HSclubsAppUITests
    profile:
      config: Staging
    analyze:
      config: Development
    archive:
      config: Production
